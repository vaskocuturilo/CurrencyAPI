apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-service-deployment
spec:
  selector:
    matchLabels:
      app: currency
  replicas: 3
  template:
    metadata:
      labels:
        app: currency
    spec:
      containers:
        - name: currency
          image: vaskocuturilo/currency-service
          resources:
            requests:
              memory: 100Mi
          ports:
            - containerPort: 8080