services:
  postgres:
    image: postgres:18-alpine3.24
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - backend/.env

  api:
    image: vaskocuturilo/currency-service:latest
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: unless-stopped
    environment:
      LOG_PATH: /usr/app/logs/application.log
      SERVER_PORT: ${SERVER_PORT}
      SERVER_HOST: "0.0.0.0"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - logs:/usr/app/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:$$SERVER_PORT/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  redis:
    image: redis:8-alpine3.23
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - cache:/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis-insight:
    image: redis/redisinsight:2.42
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    networks:
      - app-network
    environment:
      - RI_ENCRYPTION_KEY=${RI_ENCRYPTION_KEY}
    volumes:
      - redis-insight:/data
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - backend/.env

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    ports:
      - "127.0.0.1:3200:3200"
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - app-network

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    ports:
      - "127.0.0.1:9080:9080" # HTTP interface
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP http
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    networks:
      - app-network

  frontend:
    hostname: frontend-currency-converter
    container_name: frontend-currency-converter
    image: frontend-currency-converter
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  nginx:
    hostname: nginx-currency-converter
    container_name: nginx-currency-converter
    image: nginxinc/nginx-unprivileged:alpine
    restart: always
    ports:
      - "80:8080"
    volumes:
      - ./nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_started

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    command:
      - "--interval=14400"
      - "--label-enable"
      - "--rolling-restart"
      - "--cleanup"
    volumes:
      - ~/.docker/config.watchtower.json:/config/config.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_CONFIG=/config
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  pgdata:
  cache:
  redis-insight:
  tempo_data: